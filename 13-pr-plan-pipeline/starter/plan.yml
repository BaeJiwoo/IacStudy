name: terraform-plan

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".github/workflows/plan.yml"

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: 12-modules-remote-state/live/dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Create plan
        run: terraform plan -input=false -out=tfplan

      - name: Create JSON plan
        run: terraform show -json tfplan > tfplan.json

      # TODO: Run starter/plan-summary.sh and write the result to GITHUB_STEP_SUMMARY.
      # TODO: Add OIDC authentication with read-only permissions for the Plan job.
      # TODO: Store sensitive plan artifacts only when Apply requires the exact saved plan.
