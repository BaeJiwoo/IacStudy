name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Approved commit SHA
        required: true
      plan_digest:
        description: Approved plan SHA256 digest
        required: true
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

